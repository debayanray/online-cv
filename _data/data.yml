career-profile:
    title: Career Profile
    summary: |
      **Staff Software Engineer** with **20+ years** building distributed cloud-native
      systems across product companies, enterprise IT services, and open-source communities.

      Currently leading **Alation's Curation & Trusted Context pillar** - designing and
      shipping **production-grade Agentic AI at scale** while partnering with C-suite on
      strategic roadmaps. Proven track record owning full product lifecycles, mentoring
      globally distributed teams (India, Poland, US), and contributing to **OpenStack**
      open-source.

      A collaborative engineer who listens deeply (`listen-like-you-are-wrong`),
      codes with precision, and thrives in delivering high-impact, production-grade
      solutions. In short, *an engineer who every team member and business stakeholder
      can bank on*.

      **Online profile**: <https://debayanray.github.io/online-cv/>

