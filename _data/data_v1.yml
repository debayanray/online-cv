      **Hands-on Staff Software Engineer** with **20 years** of experience
      crafting scalable, distributed systems and driving technical excellence.
      Proven track record at **Alation**, **Oracle**, **HPE**, **Hyland**,
      mentoring teams, and contributing to opensource projects (*OpenStack*).
      Known for thoughtful architecture decisions, innovative problem-solving,
      a strong `bias-for-action`, and a commitment to swiftness with quality.

      A collaborative engineer who listens deeply (`listen-like-you-are-wrong`),
      codes with precision, and thrives in delivering high-impact, production
      grade solutions. In short, *an engineer who every team member and business
      stakeholder can bank on*.

      **Online profile**: <https://debayanray.github.io/online-cv/>

